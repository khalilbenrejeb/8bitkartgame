function lobbyBroadcast(){sendAll({t:'lobby',players:NET.players.map(p=>({id:p.id,name:p.name})),map:NET.map});advert();renderLobby()}
function mpToLobby(){NET.racing=false;state='menu';hideAll();show('lb');renderLobby();music(11)}
function mpStart(){NET.seed=Math.random()*1e9|0;const arr=[];for(let k=0;k<6;k++){const p=NET.players.find(x=>x.id==k);arr.push(p?{id:k,n:p.name,h:1,eq:p.eq}:{id:k,n:BOTN[k],h:0})}
sendAll({t:'start',map:NET.map,seed:NET.seed,players:arr});hideAll();setup(NET.map,{host:true,seed:NET.seed,cfg:buildCfg(arr,0)});advert()}
function hostMsg(m){if(!m||typeof m!='object'||typeof m.c!='string'||m.c.length>16)return;const cl=NET.cl[m.c];
if(m.t=='hello'){if(cl)return;if(m.v!==GV){sendTo(m.c,{t:'ver'});return}if(NET.racing||NET.players.length>=6){sendTo(m.c,{t:'full'});return}let id=1;while(NET.players.some(p=>p.id==id))id++;NET.cl[m.c]={pid:id,last:performance.now()};NET.players.push({id,name:cleanName(m.name),eq:cleanEq(m.eq)});sendTo(m.c,{t:'welcome',id,code:NET.code});lobbyBroadcast();return}
if(!cl)return;cl.last=performance.now();
if(m.t=='bye')dropClient(m.c);
else if(m.t=='st'&&NET.racing){const k=ks[cl.pid];if(k&&k.net)setNet(k,[cl.pid,m.d,m.lat,m.v,m.b,m.s,m.n,m.f])}
else if(m.t=='shell'&&NET.racing){const o=ks[cl.pid],tg=ks[m.tg|0];if(o&&o.net){const id=String(m.id).slice(0,12);spawnShell(o,num(m.d),num(m.lat),tg&&tg!==o?tg:null,id);sendAll({t:'shell',id,o:cl.pid,d:num(m.d),lat:num(m.lat),tg:m.tg})}}
else if(m.t=='shrm'){const id=String(m.id).slice(0,12);rmShell(id);sendAll({t:'shrm',id})}}
function clientMsg(m){if(!m||typeof m!='object')return;
if(m.t=='welcome'){NET.on=true;NET.busy=0;NET.id=m.id|0;NET.hostSeen=performance.now();show('lb');renderLobby();music(11)}
else if(m.t=='hostbye')hostLeft()
else if(m.t=='lobby'){NET.players=(m.players||[]).slice(0,6).map(p=>({id:p.id|0,name:cleanName(p.name)}));NET.map=cl(m.map|0,0,MN.length-1);if(NET.on)renderLobby()}
else if(m.t=='full')mpErr('Room is full or already racing')
else if(m.t=='ver')mpErr('Different game version - refresh the page and try again')
else if(m.t=='start'&&NET.on&&Array.isArray(m.players)&&m.players.length==6){NET.map=cl(m.map|0,0,MN.length-1);hideAll();setup(NET.map,{host:false,seed:m.seed|0,cfg:buildCfg(m.players,NET.id)})}
else if(m.t=='snap'&&NET.racing&&ks.length&&Array.isArray(m.a))m.a.forEach(a=>{const k=ks[a[0]|0];if(k&&k.net)setNet(k,a)})
else if(m.t=='shell'&&NET.racing){const o=ks[m.o|0],tg=ks[m.tg|0];if(o&&o.net)spawnShell(o,num(m.d),num(m.lat),tg&&tg!==o?tg:null,String(m.id).slice(0,12))}
else if(m.t=='shrm')rmShell(String(m.id).slice(0,12))
else if(m.t=='end'&&NET.racing&&Array.isArray(m.order))mpEnd(m.order)}
function mpHost(){if(typeof mqtt=='undefined')return mpErr('Online mode needs internet (the network library failed to load)');if(NET.mq||NET.busy)return;NET.busy=1;NET.pub=$('pubc').checked;mpBrowseStop();$('mps').textContent='Creating room...';
const r4=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''),cs=[];let done=false,fails=0;
BRK.forEach((url,i)=>{const code=BL[i]+r4,c=mqtt.connect(url,{clientId:'tkh'+Math.random().toString(36).slice(2,10),keepalive:10,reconnectPeriod:0,connectTimeout:7000,will:{topic:'tkart26/'+code+'/all',payload:JSON.stringify({t:'hostbye'}),qos:0}});cs.push(c);
c.on('connect',()=>{if(done){try{c.end(true)}catch(e){}return}done=true;cs.forEach(o=>{if(o!==c)try{o.end(true)}catch(e){}});NET.mq=c;NET.code=code;NET.host=true;NET.on=true;NET.busy=0;NET.id=0;NET.players=[{id:0,name:myName,eq:curEq()}];NET.cl={};
c.subscribe(T('h'),()=>{});c.on('message',(t,b)=>onMsg(b));c.on('close',()=>{if(NET.mq===c&&NET.on)hostLeft('Lost connection to the server')});show('lb');renderLobby();music(11);advert()});
c.on('error',()=>{});c.on('close',()=>{if(!done&&++fails>=BRK.length)mpErr('Could not reach any server. Check your internet and try again.')})})}
function mpJoin(code){if(typeof mqtt=='undefined')return mpErr('Online mode needs internet (the network library failed to load)');if(NET.mq||NET.busy)return;const bi=BL.indexOf(code[0]);if(bi<0)return mpErr('Invalid room code');NET.busy=1;mpBrowseStop();$('mps').textContent='Connecting...';NET.code=code;NET.cid=Math.random().toString(36).slice(2,10);
const c=mqtt.connect(BRK[bi],{clientId:'tkc'+NET.cid,keepalive:10,reconnectPeriod:0,connectTimeout:7000,will:{topic:T('h'),payload:JSON.stringify({t:'bye',c:NET.cid}),qos:0}});NET.mq=c;
c.on('connect',()=>{c.subscribe([T('all'),T('c/'+NET.cid)],()=>{pub(T('h'),{t:'hello',c:NET.cid,v:GV,name:myName,eq:curEq()});setTimeout(()=>{if(!NET.on&&NET.mq===c)mpErr('Room not found (check the code)')},5000)});c.on('message',(t,b)=>onMsg(b))});
c.on('error',()=>{});c.on('close',()=>{if(NET.mq!==c)return;if(NET.on)hostLeft();else mpErr('Could not reach the server. Try again.')})}
setInterval(()=>{if(!NET.on)return;const now=performance.now();if(NET.host){if(!NET.racing)lobbyBroadcast();else advert();for(const cid in NET.cl)if(now-NET.cl[cid].last>(NET.racing?8000:12000))dropClient(cid)}else{pub(T('h'),{t:'ping',c:NET.cid});if(now-NET.hostSeen>12000)hostLeft('Lost connection to the host')}},3000);
function advert(clear){if(!NET.host||!NET.pub||!NET.mq||!NET.mq.connected)return;try{NET.mq.publish('tkart26/rooms/'+NET.code,clear?'':JSON.stringify({h:myName,n:NET.players.length,m:NET.map,r:NET.racing?1:0,v:GV}),{retain:true})}catch(e){}}
let BR=[],ROOMS={};
function mpBrowseStop(){BR.forEach(c=>{try{c.end(true)}catch(e){}});BR=[]}
function mpBrowse(){mpBrowseStop();ROOMS={};$('rhead').textContent='Searching for rooms...';$('rlist').innerHTML='';if(typeof mqtt=='undefined'){$('rhead').textContent='Online mode needs internet';return}
BRK.forEach(url=>{const c=mqtt.connect(url,{clientId:'tkb'+Math.random().toString(36).slice(2,10),keepalive:15,reconnectPeriod:0,connectTimeout:6000});BR.push(c);c.on('connect',()=>c.subscribe('tkart26/rooms/+',()=>{}));c.on('error',()=>{});
c.on('message',(t,b)=>{const code=t.split('/')[2]||'',str=b.toString();if(!/^[ABC][A-Z]{4}$/.test(code))return;if(!str){delete ROOMS[code];drawRooms();return}let m;try{m=JSON.parse(str)}catch(e){return}if(!m||typeof m!='object')return;ROOMS[code]={code,h:cleanName(m.h),n:cl(m.n|0,1,6),m:cl(m.m|0,0,MN.length-1),r:m.r?1:0,v:m.v,seen:performance.now()};drawRooms()})})}
function drawRooms(){const now=performance.now(),L=Object.values(ROOMS).filter(r=>now-r.seen<14000&&r.v===GV);$('rhead').textContent=L.length?'🌐 '+L.reduce((a,r)=>a+r.n,0)+' player(s) in '+L.length+' open room(s)':(BR.length?'No open rooms right now - host one!':'');$('rlist').innerHTML='';
L.forEach(r=>{const d=document.createElement('div');d.className='c';d.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;text-align:left';d.innerHTML=`<span>${esc(r.h)}'s room<br><span style="opacity:.7">${esc(MN[r.m])} · ${r.n}/6 players${r.r?' · IN RACE':''}</span></span>`;const b=document.createElement('button');b.className='kb';const full=r.r||r.n>=6;b.textContent=full?'FULL':'JOIN';b.disabled=!!full;b.onclick=()=>{const n=mpCheckName();if(!n)return;myName=n;mpJoin(r.code)};d.appendChild(b);$('rlist').appendChild(d)})}
setInterval(()=>{if($('mp').classList.contains('on'))drawRooms()},3000);
function mpCheckName(){const n=cleanName($('nm').value);if($('nm').value.trim().length<2){popT('Enter a name (2+ letters)');return null}try{localStorage.turboName=n}catch(e){}return n}
$('nm').value=(()=>{try{return localStorage.turboName||''}catch(e){return''}})();
MN.forEach((n,i)=>{const b=document.createElement('button');b.className='kb';b.textContent=n;b.onclick=()=>{if(NET.host){NET.map=i;lobbyBroadcast()}};$('lmaps').appendChild(b)});
$('multi').onclick=()=>{initA();$('mps').textContent='';show('mp');music(11);mpBrowse()};
$('b5').onclick=()=>{mpBrowseStop();show('menu');music(4)};
$('mhost').onclick=()=>{const n=mpCheckName();if(n){myName=n;mpHost()}};
$('mjoin').onclick=()=>{const n=mpCheckName(),c=$('jc').value.trim().toUpperCase();if(!n)return;if(!/^[ABC][A-Z]{4}$/.test(c)){popT('Enter the 5-letter room code');return}myName=n;mpJoin(c)};
$('lstart').onclick=()=>{if(NET.host&&!NET.racing)mpStart()};
$('lleave').onclick=()=>{mpLeave();show('mp');$('mps').textContent='';mpBrowse()};
let lbT=0,mmB,mm,podG,conf,podT=0,podP=[],podDone=false,podMsg=false;
function mmBuild(){const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');let a=1e9,b=-1e9,d=1e9,e=-1e9;TK.p.forEach(p=>{a=Math.min(a,p.x);b=Math.max(b,p.x);d=Math.min(d,p.z);e=Math.max(e,p.z)});const z=130/Math.max(b-a,e-d);mm={a,d,s:z,ox:(160-(b-a)*z)/2,oy:(160-(e-d)*z)/2};x.strokeStyle='#fff';x.lineWidth=6;x.lineJoin='round';x.beginPath();TK.p.forEach((p,i)=>{const X=mm.ox+(p.x-a)*z,Y=mm.oy+(p.z-d)*z;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.stroke();mmB=c}
function buildPod(){podG=new THREE.Group();podG.position.set(800,0,0);const bx=(w,h,x,c)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),lm(c));b.position.set(x,h/2,0);b.castShadow=b.receiveShadow=true;podG.add(b)};
bx(7,6,0,0xffd700);bx(7,4,-7.5,0xc0c0c8);bx(7,3,7.5,0xcd7f32);
const st=new THREE.Mesh(new THREE.CylinderGeometry(28,28,.6,40),lm(0x8e1b2b));st.position.y=-.2;st.receiveShadow=true;podG.add(st);
for(let i=0;i<11;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(4,24,1),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(i/11,.8,.55)}));w.position.set((i-5)*4.2,12,-14);podG.add(w)}
[-16,16].forEach(x=>{const c=new THREE.Mesh(new THREE.ConeGeometry(6,26,16,1,true),new THREE.MeshBasicMaterial({color:0xffffaa,transparent:true,opacity:.16,side:THREE.DoubleSide}));c.position.set(x,13,-4);podG.add(c)});
const pp=[],cc=[];for(let i=0;i<400;i++){pp.push((R()-.5)*50,R()*30,(R()-.5)*30);const c=new THREE.Color().setHSL(R(),1,.6);cc.push(c.r,c.g,c.b)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cc,3));conf=new THREE.Points(g,new THREE.PointsMaterial({size:1,vertexColors:true}));conf.visible=false;podG.add(conf);sc.add(podG)}
function startPodium(P){state='podium';podT=0;podDone=false;podMsg=false;podP=P;$('hud').style.display='none';$('lead').style.display='none';$('mm').style.display='none';$('big').textContent='';$('pop').textContent='';if(!podG)buildPod();conf.visible=false;music(5);
const pos=[[0,6],[-7.5,4],[7.5,3],[-16,0],[16,0],[-22,0]];P.forEach((k,i)=>{k.px=800+pos[i][0];k.py=pos[i][1];k.shown=false;k.m.position.set(k.px,k.py,i<3?0:5);k.m.rotation.y=0;k.m.visible=i>=3;k.m.userData.fl.forEach(f=>f.visible=false)})}
function podStep(dt){podT+=dt;const T=podT,e=Math.min(1,T/4.5),ee=e*e*(3-2*e),an=-1.1*(1-ee),di=42-14*ee;
cam.position.set(800+Math.sin(an)*di,22-15*ee+Math.sin(T*.5)*.6,Math.cos(an)*di);cam.lookAt(800,5,0);cam.fov=60;cam.updateProjectionMatrix();
sun.target.position.set(800,0,0);sun.position.set(850,110,60);const rv=[4.2,2.8,1.4],lb=['🏆 1st','🥈 2nd','🥉 3rd'];
podP.forEach((k,i)=>{if(i<3){if(T>=rv[i]&&!k.shown){k.shown=true;k.m.visible=true;sfx.ding();$('cut').innerHTML+=`<div>${lb[i]} — ${esc(k.n)}</div>`;if(i==0){sfx.fan();sfx.cheer();conf.visible=true;say(k===pl?'win':'winner',true,k.n)}}
if(k.shown){const a=Math.min(1,(T-rv[i])*2);k.m.position.y=k.py+(1-a)*(1-a)*30+(i==0&&a>=1?Math.abs(Math.sin(T*6))*1.3:0);k.m.rotation.y=i==0?Math.sin(T*3)*.6:Math.sin(T*2+i)*.25}}else k.m.position.y=Math.abs(Math.sin(T*4+i))*.4});
if(conf.visible){const a=conf.geometry.attributes.position;for(let q=0;q<a.count;q++){let y=a.getY(q)-7*dt;if(y<0)y=30;a.setY(q,y)}a.needsUpdate=true}
if(T>5.8&&!podMsg){podMsg=true;const r=podP.indexOf(pl)+1;if(r>3){$('cut').innerHTML+=`<div>You finished ${r}th</div>`;say('lose',true)}}
if(T>=7.5&&!podDone){podDone=true;show('res')}}
